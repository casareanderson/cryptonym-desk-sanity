name: setup-check

# Proves docs/SETUP.md still works from a fresh clone: install, tests, a build from the public
# dataset, the read-only proposal script, the corpus export, and the Studio build. No Sanity token.
on:
  workflow_dispatch:
  schedule:
    - cron: "59 6 * * 1"
  push:
    paths:
      - "docs/SETUP.md"
      - "scripts/setup-check.sh"
      - "package*.json"
      - "studio/package*.json"
      - ".github/workflows/setup-check.yml"
  pull_request:
    paths:
      - "docs/SETUP.md"
      - "scripts/setup-check.sh"
      - "package*.json"
      - "studio/package*.json"

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: STUDIO=1 bash scripts/setup-check.sh
